name: Validate repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public Git tree
        run: python tools/check_public_tree.py
      - name: Install audio inspection tools
        run: choco install ffmpeg --no-progress -y
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m cinema_lab init --date 2026-11-11 --slug ci-sample --title "Synthetic CI sample" --recipe continuous-scroll
      - run: python -m cinema_lab validate projects/2026-11-11/ci-sample
      - run: pytest -q
